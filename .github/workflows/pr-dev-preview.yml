name: PR Preview Deploy

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read
  pull-requests: write

jobs:
  deploy-preview:
    name: Deploy preview to Cloud Run
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    outputs:
      preview_url: ${{ steps.preview_metadata.outputs.preview_url }}
      service_name: ${{ steps.preview_metadata.outputs.service_name }}
    env:
      GCP_PROJECT: ${{ vars.GCP_PROJECT || 'ai-universe-2025' }}
      GCP_REGION: ${{ vars.GCP_REGION || 'us-central1' }}
      ARTIFACT_REPOSITORY: ${{ vars.ARTIFACT_REPOSITORY || 'ai-universe-previews' }}
      HEALTH_CHECK_MAX_ATTEMPTS: ${{ vars.HEALTH_CHECK_MAX_ATTEMPTS || '12' }}
      HEALTH_CHECK_INTERVAL_SECONDS: ${{ vars.HEALTH_CHECK_INTERVAL_SECONDS || '5' }}
      GCP_CREDENTIALS_JSON: ${{ secrets.GCP_SA_KEY != '' && secrets.GCP_SA_KEY || secrets.GOOGLE_CREDENTIALS }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            ai-universe-app/package-lock.json

      - name: Ensure GCP credentials secret is available
        run: |
          if [[ -z "${GCP_CREDENTIALS_JSON}" ]]; then
            echo "::error::Missing Google Cloud credentials. Set the GCP_SA_KEY secret (as documented in the README) or GOOGLE_CREDENTIALS."
            exit 1
          fi

      - name: Authenticate with Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ env.GCP_CREDENTIALS_JSON }}

      - name: Set up gcloud CLI
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT }}

      - name: Enable required APIs
        run: |
          gcloud services enable \
            run.googleapis.com \
            cloudbuild.googleapis.com \
            artifactregistry.googleapis.com

      - name: Build shared packages
        run: |
          npm ci
          npm ci --prefix ai-universe-app
          npm run build --prefix ai-universe-app --if-present

      - name: Comment deployment start
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment ${{ github.event.pull_request.number }} --body "🚀 Preview deployment started for commit ${{ github.sha }}. Track progress in [workflow run](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})."

      - name: Deploy preview
        run: |
          ./deploy.sh pr "${{ github.event.pull_request.number }}" --image-tag "${{ github.sha }}"

      - name: Capture preview metadata
        id: preview_metadata
        run: |
          PREVIEW_URL=$(cat preview-url.txt)
          SERVICE_NAME=$(cat preview-service.txt)
          echo "preview_url=${PREVIEW_URL}" >> "$GITHUB_OUTPUT"
          echo "service_name=${SERVICE_NAME}" >> "$GITHUB_OUTPUT"
          echo "PREVIEW_URL=${PREVIEW_URL}" >> "$GITHUB_ENV"
          echo "SERVICE_NAME=${SERVICE_NAME}" >> "$GITHUB_ENV"

      - name: Wait for /health endpoint
        run: |
          attempts=${HEALTH_CHECK_MAX_ATTEMPTS}
          delay=${HEALTH_CHECK_INTERVAL_SECONDS}
          for attempt in $(seq 1 "$attempts"); do
            echo "Attempt ${attempt}/${attempts}: probing ${PREVIEW_URL}/health"
            if response=$(curl -sf "${PREVIEW_URL}/health"); then
              echo "Health check succeeded: ${response}"
              exit 0
            fi
            sleep "$delay"
          done
          echo "Service did not become healthy in time" >&2
          exit 1

      - name: Comment deployment success
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment ${{ github.event.pull_request.number }} --body "✅ Preview ready: [Visit service](${PREVIEW_URL}) · [/health](${PREVIEW_URL}/health) · [/mcp](${PREVIEW_URL}/mcp)"

      - name: Comment deployment failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment ${{ github.event.pull_request.number }} --body "❌ Preview deployment failed. Review the [workflow run](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}) for details."

  run-smoke-tests:
    name: Run MCP smoke tests
    needs: deploy-preview
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    env:
      GCP_PROJECT: ${{ vars.GCP_PROJECT || 'ai-universe-2025' }}
      GCP_REGION: ${{ vars.GCP_REGION || 'us-central1' }}
      MCP_TEST_TIMEOUT_MS: ${{ vars.MCP_TEST_TIMEOUT_MS || '300000' }}
      MCP_TEST_MAX_ATTEMPTS: ${{ vars.MCP_TEST_MAX_ATTEMPTS || '5' }}
      MCP_TEST_RETRY_DELAY_MS: ${{ vars.MCP_TEST_RETRY_DELAY_MS || '1000' }}
      MCP_EXPECTED_PRIMARY_COUNT: ${{ vars.MCP_EXPECTED_PRIMARY_COUNT || '0' }}
      MCP_EXPECTED_SECONDARY_COUNT: ${{ vars.MCP_EXPECTED_SECONDARY_COUNT || '0' }}
      MCP_EXPECTED_TOOLS: ${{ vars.MCP_EXPECTED_TOOLS || 'ai_universe_greeting' }}
      GCP_CREDENTIALS_JSON: ${{ secrets.GCP_SA_KEY != '' && secrets.GCP_SA_KEY || secrets.GOOGLE_CREDENTIALS }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            ai-universe-app/package-lock.json

      - name: Ensure GCP credentials secret is available
        run: |
          if [[ -z "${GCP_CREDENTIALS_JSON}" ]]; then
            echo "::error::Missing Google Cloud credentials. Set the GCP_SA_KEY secret (as documented in the README) or GOOGLE_CREDENTIALS."
            exit 1
          fi

      - name: Authenticate with Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ env.GCP_CREDENTIALS_JSON }}

      - name: Set up gcloud CLI
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT }}

      - name: Resolve preview URL
        id: resolve_preview
        run: |
          if [[ -n "${{ needs.deploy-preview.outputs.preview_url }}" ]]; then
            echo "preview_url=${{ needs.deploy-preview.outputs.preview_url }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          SERVICE_NAME=${{ needs.deploy-preview.outputs.service_name }}
          URL=$(gcloud run services describe "$SERVICE_NAME" --region "$GCP_REGION" --format='value(status.url)')
          echo "preview_url=${URL}" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: npm ci

      - name: Run MCP smoke tests
        env:
          MCP_SERVER_URL: ${{ steps.resolve_preview.outputs.preview_url }}
        run: npm run test:mcp

      - name: Comment smoke test success
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIEW_URL: ${{ steps.resolve_preview.outputs.preview_url }}
        run: |
          gh pr comment ${{ github.event.pull_request.number }} --body "✅ MCP smoke tests passed for [preview](${PREVIEW_URL})."

      - name: Comment smoke test failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIEW_URL: ${{ steps.resolve_preview.outputs.preview_url }}
        run: |
          gh pr comment ${{ github.event.pull_request.number }} --body "❌ MCP smoke tests failed for [preview](${PREVIEW_URL}). Please inspect the logs."
