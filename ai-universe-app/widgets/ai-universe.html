<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>AI Universe Widget</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: "OpenAI Sans", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      body {
        margin: 0;
        padding: 16px;
        background: transparent;
        color: var(--text-color, #0b0c0f);
      }

      .universe-card {
        border-radius: 16px;
        border: 1px solid rgba(15, 23, 42, 0.08);
        padding: 20px;
        background: rgba(255, 255, 255, 0.9);
        box-shadow: 0 12px 30px rgba(15, 23, 42, 0.08);
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      [data-theme="dark"] .universe-card {
        border-color: rgba(148, 163, 184, 0.18);
        background: rgba(15, 23, 42, 0.7);
        color: #f8fafc;
        box-shadow: 0 12px 36px rgba(15, 23, 42, 0.45);
      }

      .universe-heading {
        font-size: 1.25rem;
        font-weight: 600;
        margin: 0;
      }

      .universe-subtitle {
        font-size: 0.95rem;
        line-height: 1.4;
        margin: 0;
        color: rgba(15, 23, 42, 0.7);
      }

      [data-theme="dark"] .universe-subtitle {
        color: rgba(226, 232, 240, 0.75);
      }

      button {
        align-self: flex-start;
        border: none;
        border-radius: 999px;
        padding: 10px 18px;
        font-size: 0.9rem;
        font-weight: 600;
        cursor: pointer;
        color: #fff;
        background: linear-gradient(135deg, #8b5cf6, #0ea5e9);
        transition: transform 160ms ease, box-shadow 160ms ease;
      }

      button:hover {
        transform: translateY(-1px);
        box-shadow: 0 10px 24px rgba(14, 165, 233, 0.3);
      }

      button:active {
        transform: translateY(0);
        box-shadow: none;
      }
    </style>
  </head>
  <body>
    <div class="universe-card" id="universe-card">
      <h2 class="universe-heading" id="universe-heading">Hello, explorer!</h2>
      <p class="universe-subtitle" id="universe-subtitle">
        This widget renders the greeting returned by your MCP tool.
      </p>
      <button id="followup-button" type="button">Greet again</button>
    </div>
    <script type="module">
      const card = document.getElementById("universe-card");
      const heading = document.getElementById("universe-heading");
      const subtitle = document.getElementById("universe-subtitle");
      const button = document.getElementById("followup-button");

      const applyTheme = () => {
        const theme = window.openai?.theme ?? "light";
        document.documentElement.dataset.theme = theme;
      };

      const render = () => {
        const output = window.openai?.toolOutput ?? {};
        const state = window.openai?.widgetState ?? {};
        const greeting = state.greeting ?? output?.structuredContent?.greeting ?? "Hello, explorer!";
        const name = output?.structuredContent?.name ?? "explorer";

        heading.textContent = greeting;
        subtitle.textContent = `ChatGPT knows how to greet ${name}.`;

        window.openai?.setWidgetState?.({ greeting, name }).catch((error) => {
          console.warn("Failed to persist widget state", error);
        });
      };

      button.addEventListener("click", () => {
        const name = window.openai?.toolOutput?.structuredContent?.name ?? "explorer";
        window.openai
          ?.sendFollowupTurn?.({ prompt: `Please greet ${name} again.` })
          .catch((error) => console.warn("Failed to trigger follow-up", error));
      });

      window.addEventListener("openai:set_globals", () => {
        applyTheme();
        render();
      });

      window.addEventListener("openai:tool_response", () => {
        render();
      });

      applyTheme();
      render();
    </script>
  </body>
</html>
